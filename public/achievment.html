<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
   </head>

   <div class="bg-white min-h-screen">
    <!-- Navbar -->
        <header class="bg-blue-200 text-white flex justify-between items-center px-8 py-4">
              <h1 class="text-xl font-bold">EXSTERSIA</h1>
                <nav class="flex items-center space-x-6">
                 <a href="#" class="hover:underline">About</a>
                 <a href="#" class="hover:underline">Members</a>
                 <a href="#" class="hover:underline">Gallery</a>
                 <a href="#" class="hover:underline">Achievements</a>
                <button class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-md">Sign Up</button>
            </nav>
    </header>
  
    <!-- Achievements Section -->
    <main class="py-10">
      <h2 class="text-2xl md:text-3xl font-bold text-left mb-8">Our Newest Achievements</h2>
      <div class="flex items-center justify-center space-x-6 px-4">
        <!-- Left Arrow -->
        <button class="text-gray-500 hover:text-gray-700 text-2xl">&larr;</button>
  
        <!-- Achievement Cards -->
        <div class="grid grid-cols-3 gap-6">
          <!-- Card 1 -->
          <div class="bg-blue-200 p-4 rounded-lg shadow-lg text-center">
            <img src="your-image1.jpg" alt="Achievement 1" class="rounded-lg w-full object-cover h-48 mb-4">
            <p class="font-semibold text-lg">Competition Title 1</p>
          </div>
  
          <!-- Card 2 (Highlighted) -->
          <div class="bg-blue-300 p-6 rounded-lg shadow-xl text-center">
            <h3 class="font-bold text-lg mb-2">Singapore International Choral Festival</h3>
            <img src="your-image2.jpg" alt="Achievement 2" class="rounded-lg w-full object-cover h-48 mb-4">
            <p class="text-sm">Explanation about the competition</p>
            <p class="font-bold mt-2">Medal</p>
          </div>
  
          <!-- Card 3 -->
          <div class="bg-blue-200 p-4 rounded-lg shadow-lg text-center">
            <img src="your-image3.jpg" alt="Achievement 3" class="rounded-lg w-full object-cover h-48 mb-4">
            <p class="font-semibold text-lg">Competition Title 3</p>
          </div>
        </div>
  
        <!-- Right Arrow -->
        <button class="text-gray-500 hover:text-gray-700 text-2xl">&rarr;</button>
      </div>
  
    
      </div>
    </main>
  </div>
